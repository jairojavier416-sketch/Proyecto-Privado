name: Bot Admin Merge Directo
on:
  issue_comment:
    types: [created]

jobs:
  force-merge:
    # Solo si el comentario es /merge y el autor es uno de los 3 elegidos
    if: |
      github.event.issue.pull_request &&
      github.event.comment.body == '/merge' && 
      (github.actor == 'jairojavier1963-dot' || 
       github.actor == 'Compañero2' || 
       github.actor == 'Compañero3')
    
    runs-on: ubuntu-latest
    steps:
      - name: Forzar el Merge en Main
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.ADMIN_BOT_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'merge' // O 'squash' si prefieres
            });
            
            console.log(`PR #${prNumber} fusionado a la fuerza por admin.`);
