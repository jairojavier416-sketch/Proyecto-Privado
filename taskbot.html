<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>⚡ TaskBot — Gestión de Equipos</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0f;--surface:#16161a;--surface2:#1e1e24;--border:#2a2a35;
  --text:#e8e8f0;--text2:#7777a0;--radius:12px;
  --font-head:'Syne',sans-serif;--font-mono:'DM Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font-head);min-height:100vh}
button{font-family:var(--font-head);cursor:pointer}
input,textarea,select{font-family:var(--font-head)}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:62px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem}
.brand h1{font-size:1.3rem;font-weight:800;letter-spacing:-0.5px}
.brand-sub{font-family:var(--font-mono);font-size:.68rem;color:var(--text2);border:1px solid var(--border);padding:2px 7px;border-radius:4px}
.nav{display:flex;gap:.4rem;flex-wrap:wrap}
.nav-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:.38rem .9rem;border-radius:8px;font-size:.82rem;transition:all .2s}
.nav-btn:hover{color:var(--text);border-color:var(--text2)}
.nav-btn.active{background:var(--surface2);border-color:#7c5cbf;color:var(--text)}
.nav-export{border-color:#2ed57340;color:#2ed573}
.nav-export:hover{background:#2ed57315}

/* MAIN */
.main{padding:1.75rem;max-width:1400px;margin:0 auto}

/* VIEWS */
.view{display:none;animation:fadeIn .3s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* DASHBOARD */
.dash-hero{text-align:center;padding:2rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:2rem}
.dash-hero h2{font-size:1.9rem;font-weight:800;letter-spacing:-1px}
.dash-hero p{color:var(--text2);font-family:var(--font-mono);font-size:.85rem;margin-top:.3rem}
.global-stats{display:flex;justify-content:center;gap:2rem;margin-top:1.25rem;flex-wrap:wrap}
.gstat{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.gstat-n{font-size:1.9rem;font-weight:800}
.gstat-l{font-family:var(--font-mono);font-size:.72rem;color:var(--text2)}
.c-green{color:#2ed573}.c-yellow{color:#ffa502}.c-red{color:#ff4757}

.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.1rem}
.group-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.4rem;border-left:3px solid var(--gc);transition:transform .2s,border-color .2s}
.group-card:hover{transform:translateY(-2px);border-color:var(--gc)}
.gc-head{display:flex;align-items:center;gap:.7rem;margin-bottom:.9rem}
.gc-emoji{font-size:1.7rem}
.gc-info h3{font-weight:700;font-size:.95rem}
.gc-info span{font-family:var(--font-mono);font-size:.72rem;color:var(--text2)}
.gc-badge{margin-left:auto;padding:3px 9px;border-radius:20px;font-size:.75rem;font-weight:600;white-space:nowrap}
.progress-wrap{margin:.6rem 0}
.progress-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;transition:width .5s}
.progress-lbl{font-family:var(--font-mono);font-size:.68rem;color:var(--text2);margin-top:3px;display:block}
.prio-chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.pchip{padding:3px 9px;border-radius:20px;border:1px solid;font-size:.72rem;display:flex;align-items:center;gap:3px}
.members-row{display:flex;gap:.35rem;flex-wrap:wrap;margin:.6rem 0}
.mavatar{width:34px;height:34px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;background:none;transition:transform .2s}
.mavatar:hover{transform:scale(1.15)}
.btn-all{width:100%;padding:.55rem;border-radius:8px;background:none;border:1px solid var(--border);color:var(--text);font-size:.83rem;transition:all .2s;margin-top:.5rem}
.btn-all:hover{background:var(--surface2);border-color:var(--gc)}

/* GROUP VIEW */
.gv-header{display:flex;align-items:center;gap:.9rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.4rem;margin-bottom:1.1rem;border-left:4px solid var(--gc);flex-wrap:wrap}
.back-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:.38rem .7rem;border-radius:8px;font-size:.83rem;transition:all .2s;white-space:nowrap}
.back-btn:hover{color:var(--text)}
.gv-title{display:flex;align-items:center;gap:.65rem;flex:1}
.gv-emoji{font-size:1.8rem}
.gv-title h2{font-weight:800;font-size:1.1rem}
.gv-sub{font-family:var(--font-mono);font-size:.75rem;color:var(--text2);margin-top:2px}
.btn-new{padding:.52rem 1.1rem;border:none;border-radius:8px;color:#000;font-weight:700;font-size:.85rem;transition:filter .2s;white-space:nowrap}
.btn-new:hover{filter:brightness(1.12)}

.member-tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.9rem}
.mtab{background:none;border:1px solid var(--border);color:var(--text2);padding:.3rem .8rem;border-radius:20px;font-size:.82rem;transition:all .2s}
.mtab:hover{color:var(--text)}
.mtab.active{font-weight:700}

.filters{display:flex;gap:1.2rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.65rem 1rem;margin-bottom:1rem;flex-wrap:wrap}
.fg{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.flabel{font-family:var(--font-mono);font-size:.72rem;color:var(--text2)}
.fbtn{background:none;border:1px solid var(--border);color:var(--text2);padding:.28rem .7rem;border-radius:20px;font-size:.78rem;transition:all .2s}
.fbtn:hover,.fbtn.active{background:var(--surface2);color:var(--text);border-color:var(--text2)}
.fbtn.fa.active{border-color:#ff4757;color:#ff4757;background:#ff475715}
.fbtn.fm.active{border-color:#ffa502;color:#ffa502;background:#ffa50215}
.fbtn.fb.active{border-color:#2ed573;color:#2ed573;background:#2ed57315}

.tasks-list{display:flex;flex-direction:column;gap:.55rem}
.empty{text-align:center;padding:2.5rem;color:var(--text2)}
.empty span{font-size:2.5rem;display:block;margin-bottom:.5rem}

/* TASK CARD */
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;overflow:hidden;transition:all .2s}
.tcard:hover{border-color:var(--pc);box-shadow:0 2px 12px rgba(0,0,0,.3)}
.tcard.done{opacity:.5}
.tpbar{width:3px;background:var(--pc);flex-shrink:0}
.tmain{display:flex;align-items:flex-start;gap:.7rem;padding:.85rem .95rem;flex:1;min-width:0}
.tchk{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);background:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem;font-weight:700;transition:all .2s;flex-shrink:0;margin-top:1px}
.tchk:hover{border-color:var(--gc,var(--text2))}
.tchk.checked{border-color:var(--gc);background:var(--gc)}
.tcontent{flex:1;min-width:0}
.ttrow{display:flex;align-items:flex-start;gap:.6rem;flex-wrap:wrap}
.ttitle{font-weight:600;font-size:.92rem;line-height:1.4}
.tcard.done .ttitle{text-decoration:line-through}
.tbadges{display:flex;gap:.35rem;flex-wrap:wrap;margin-left:auto}
.pbadge{padding:2px 8px;border-radius:12px;font-size:.72rem;font-weight:600;display:flex;align-items:center;gap:3px;white-space:nowrap}
.abadge{padding:2px 8px;border-radius:12px;font-size:.72rem;border:1px solid;white-space:nowrap}
.abadge-all{border-color:var(--border);color:var(--text2)}
.tdesc{font-family:var(--font-mono);font-size:.78rem;color:var(--text2);margin-top:.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tdesc.exp{white-space:normal}
.tmeta{display:flex;gap:.8rem;margin-top:.4rem;font-family:var(--font-mono);font-size:.7rem;color:var(--text2);flex-wrap:wrap}
.tactions{display:flex;gap:.25rem;flex-shrink:0}
.tbtn{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:.78rem;transition:all .2s}
.tbtn:hover{background:var(--surface2)}
.tbtn-del:hover{border-color:#ff4757;background:#ff475715}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:999;padding:1rem;backdrop-filter:blur(4px);animation:fadeIn .2s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:480px;border-top:3px solid var(--gc);animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.4rem;border-bottom:1px solid var(--border)}
.mhead h3{font-weight:700;font-size:.95rem}
.mclose{background:none;border:1px solid var(--border);color:var(--text2);width:26px;height:26px;border-radius:6px;font-size:.85rem}
.mbody{padding:1.1rem 1.4rem;display:flex;flex-direction:column;gap:.85rem}
.field label{font-family:var(--font-mono);font-size:.72rem;color:var(--text2);display:block;margin-bottom:.35rem}
.finput{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.55rem .8rem;font-size:.88rem;width:100%}
.finput:focus{outline:none;border-color:var(--gc,#7c5cbf)}
.ftarea{resize:vertical;min-height:65px}
.fselect{cursor:pointer}
.psel{display:flex;gap:.45rem}
.psbtn{flex:1;border:1px solid;border-radius:8px;padding:.45rem;font-weight:600;font-size:.82rem;transition:all .2s;background:none}
.anote{font-family:var(--font-mono);font-size:.72rem;margin-top:3px}
.ferr{font-family:var(--font-mono);font-size:.72rem;color:#ff4757}
.mfoot{display:flex;justify-content:flex-end;gap:.65rem;padding:.9rem 1.4rem;border-top:1px solid var(--border)}
.btn-cancel{background:none;border:1px solid var(--border);color:var(--text2);padding:.5rem 1rem;border-radius:8px;font-size:.87rem}
.btn-cancel:hover{color:var(--text)}
.btn-create{border:none;color:#000;padding:.5rem 1.3rem;border-radius:8px;font-weight:700;font-size:.87rem;transition:filter .2s}
.btn-create:hover{filter:brightness(1.1)}

/* MEMBERS PANEL */
.mp-head{margin-bottom:1.4rem}
.mp-head h2{font-size:1.45rem;font-weight:800}
.mp-head p{color:var(--text2);font-family:var(--font-mono);font-size:.82rem;margin-top:.3rem}
.gtabs{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:1.3rem}
.gtab{background:none;border:1px solid var(--border);color:var(--text2);padding:.45rem .9rem;border-radius:8px;font-size:.87rem;display:flex;align-items:center;gap:.45rem;transition:all .2s}
.gtab:hover{color:var(--text)}
.gtab-c{font-family:var(--font-mono);font-size:.68rem;background:var(--border);border-radius:12px;padding:2px 6px;color:#fff}
.mcontent{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.mtoolbar{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.4rem;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:.65rem}
.mtoolbar h3{font-weight:700;font-size:1rem}
.tbar-acts{display:flex;gap:.45rem}
.btn-vt{background:none;border:1px solid var(--border);color:var(--text2);padding:.45rem .9rem;border-radius:8px;font-size:.82rem;transition:all .2s}
.btn-vt:hover{color:var(--text)}
.btn-am{border:none;color:#000;padding:.45rem 1rem;border-radius:8px;font-weight:700;font-size:.82rem}
.amform{padding:1.1rem 1.4rem;border-bottom:1px solid var(--border);border-left:3px solid var(--gc);background:var(--surface2)}
.amform h4{font-weight:700;margin-bottom:.65rem;font-size:.9rem}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.65rem;margin-bottom:.65rem}
.frow .field label{font-family:var(--font-mono);font-size:.72rem;color:var(--text2);display:block;margin-bottom:.3rem}
.fi{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:.45rem .7rem;font-size:.85rem;width:100%}
.fi:focus{outline:none;border-color:var(--text2)}
.btn-ca{border:none;color:#000;padding:.45rem 1.1rem;border-radius:8px;font-weight:700;font-size:.83rem}
.mlist{}
.empty-m{text-align:center;padding:2rem;color:var(--text2)}
.mrow{display:flex;align-items:center;gap:.9rem;padding:.9rem 1.4rem;border-bottom:1px solid var(--border);transition:background .15s}
.mrow:last-child{border-bottom:none}
.mrow:hover{background:var(--surface2)}
.mav-lg{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem}
.mdetails{flex:1;min-width:0}
.mname{font-weight:600;font-size:.92rem;display:block}
.mrole{font-family:var(--font-mono);font-size:.72rem;color:var(--text2);display:block}
.memail{font-family:var(--font-mono);font-size:.68rem;color:var(--text2);display:block;margin-top:2px}
.macts{display:flex;align-items:center;gap:.45rem}
.btn-vm{background:none;border:1px solid;padding:.3rem .75rem;border-radius:6px;font-size:.78rem;transition:all .2s}
.btn-rm{background:none;border:1px solid var(--border);border-radius:6px;padding:.3rem .55rem;font-size:.78rem;transition:all .2s}
.btn-rm:hover{border-color:#ff4757;background:#ff475715}
.conf-rm{display:flex;align-items:center;gap:.35rem;font-size:.78rem;color:var(--text2)}
.btn-yes{background:#ff4757;color:#fff;border:none;padding:3px 9px;border-radius:6px;font-size:.78rem}
.btn-no{background:none;border:1px solid var(--border);color:var(--text2);padding:3px 9px;border-radius:6px;font-size:.78rem}

/* NOTIFICATION */
.notif{position:fixed;bottom:1.4rem;right:1.4rem;padding:.65rem 1.1rem;border-radius:10px;font-size:.87rem;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.5);border:1px solid;animation:slideIn .3s ease}
.notif-ok{background:var(--surface);border-color:#2ed57360;color:#2ed573}
.notif-err{background:var(--surface);border-color:#ff475760;color:#ff4757}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}

@media(max-width:600px){
  .header{height:auto;padding:.75rem}
  .main{padding:1rem}
  .gv-header{flex-wrap:wrap}
}
</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <span style="font-size:1.4rem">⚡</span>
    <h1>TaskBot</h1>
    <span class="brand-sub">Gestión de Equipos</span>
  </div>
  <nav class="nav">
    <button class="nav-btn active" onclick="showView('dashboard')">📊 Dashboard</button>
    <button class="nav-btn" onclick="showView('members')">👥 Miembros</button>
    <button class="nav-btn nav-export" onclick="exportJSON()">💾 Exportar JSON</button>
  </nav>
</header>

<main class="main">
  <div id="view-dashboard" class="view active"></div>
  <div id="view-group" class="view"></div>
  <div id="view-members" class="view"></div>
</main>

<div id="modal-overlay" class="overlay" style="display:none" onclick="closeModal(event)"></div>
<div id="notif" class="notif" style="display:none"></div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const DEFAULT_GROUPS = [
  { id:"alpha", name:"Grupo Alpha", color:"#FF6B6B", emoji:"🔺",
    members:[
      {id:"alpha_1",name:"Ana García",role:"Líder",email:"ana@equipo.com"},
      {id:"alpha_2",name:"Carlos López",role:"Desarrollador",email:"carlos@equipo.com"},
      {id:"alpha_3",name:"Marta Ruiz",role:"Diseñadora",email:"marta@equipo.com"}
    ]},
  { id:"beta", name:"Grupo Beta", color:"#4ECDC4", emoji:"🔷",
    members:[
      {id:"beta_1",name:"María Torres",role:"Líder",email:"maria@equipo.com"},
      {id:"beta_2",name:"Juan Pérez",role:"Analista",email:"juan@equipo.com"},
      {id:"beta_3",name:"Sofía Mendez",role:"QA",email:"sofia@equipo.com"}
    ]},
  { id:"gamma", name:"Grupo Gamma", color:"#A29BFE", emoji:"🟣",
    members:[
      {id:"gamma_1",name:"Laura Sánchez",role:"Líder",email:"laura@equipo.com"},
      {id:"gamma_2",name:"Pedro Ramírez",role:"Backend",email:"pedro@equipo.com"},
      {id:"gamma_3",name:"Isabel Vega",role:"Frontend",email:"isabel@equipo.com"}
    ]},
  { id:"delta", name:"Grupo Delta", color:"#FDCB6E", emoji:"🔶",
    members:[
      {id:"delta_1",name:"Roberto Díaz",role:"Líder",email:"roberto@equipo.com"},
      {id:"delta_2",name:"Elena Gómez",role:"DevOps",email:"elena@equipo.com"},
      {id:"delta_3",name:"Andrés Castro",role:"Scrum Master",email:"andres@equipo.com"}
    ]},
  { id:"omega", name:"Grupo Omega", color:"#55EFC4", emoji:"🟢",
    members:[
      {id:"omega_1",name:"Valentina Cruz",role:"Líder",email:"vale@equipo.com"},
      {id:"omega_2",name:"Miguel Herrera",role:"Data Engineer",email:"miguel@equipo.com"},
      {id:"omega_3",name:"Natalia Flores",role:"UX Research",email:"natalia@equipo.com"}
    ]}
];

const DEFAULT_TASKS = [
  {id:"t1",title:"Revisar documentación API",description:"Actualizar todos los endpoints con la nueva versión.",priority:"alta",groupId:"alpha",assignedTo:"todos",createdAt:"2025-02-01T09:00:00Z",completed:false,completedBy:null,completedAt:null,createdBy:"alpha_1"},
  {id:"t2",title:"Configurar servidor de staging",description:"Solo Carlos se encarga de esta tarea de infraestructura.",priority:"alta",groupId:"alpha",assignedTo:"alpha_2",createdAt:"2025-02-02T10:30:00Z",completed:false,completedBy:null,completedAt:null,createdBy:"alpha_1"},
  {id:"t3",title:"Preparar mockups de UI",description:"Diseño de pantallas para el sprint siguiente.",priority:"media",groupId:"beta",assignedTo:"todos",createdAt:"2025-02-03T08:00:00Z",completed:false,completedBy:null,completedAt:null,createdBy:"beta_1"},
  {id:"t4",title:"Actualizar dependencias npm",description:"Revisar paquetes con vulnerabilidades.",priority:"baja",groupId:"gamma",assignedTo:"gamma_2",createdAt:"2025-02-04T11:00:00Z",completed:true,completedBy:"gamma_2",completedAt:"2025-02-05T15:00:00Z",createdBy:"gamma_1"}
];

// ─── STATE ───────────────────────────────────────────────────────────────────
let groups = JSON.parse(localStorage.getItem('tb_groups') || 'null') || DEFAULT_GROUPS;
let tasks  = JSON.parse(localStorage.getItem('tb_tasks')  || 'null') || DEFAULT_TASKS;
let currentGroupId   = null;
let currentMemberId  = null;
let filterPriority   = 'todas';
let filterStatus     = 'todas';
let selectedMGroupId = groups[0]?.id;
let expandedTasks    = new Set();

function save(){
  localStorage.setItem('tb_groups', JSON.stringify(groups));
  localStorage.setItem('tb_tasks',  JSON.stringify(tasks));
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
const PCFG = {
  alta: {color:'#FF4757',bg:'#FF475715',icon:'🔴',label:'Alta'},
  media:{color:'#FFA502',bg:'#FFA50215',icon:'🟡',label:'Media'},
  baja: {color:'#2ED573',bg:'#2ED57315',icon:'🟢',label:'Baja'}
};
const ROLES = ['Líder','Desarrollador','Diseñador','Analista','QA','DevOps','Frontend','Backend','Scrum Master','Otro'];

function fmtDate(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
}
function initials(name){return name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase()}
function getGroup(id){return groups.find(g=>g.id===id)}
function getMember(groupId,memberId){return getGroup(groupId)?.members.find(m=>m.id===memberId)}

function getVisibleTasks(groupId, memberId=null, pf='todas', sf='todas'){
  return tasks.filter(t=>{
    if(t.groupId !== groupId) return false;
    if(memberId && t.assignedTo !== 'todos' && t.assignedTo !== memberId) return false;
    if(pf !== 'todas' && t.priority !== pf) return false;
    if(sf === 'pendientes' && t.completed) return false;
    if(sf === 'completadas' && !t.completed) return false;
    return true;
  });
}

function getStats(groupId){
  const gt = tasks.filter(t=>t.groupId===groupId);
  return {
    total: gt.length,
    completed: gt.filter(t=>t.completed).length,
    pending: gt.filter(t=>!t.completed).length,
    alta:  gt.filter(t=>t.priority==='alta'  && !t.completed).length,
    media: gt.filter(t=>t.priority==='media' && !t.completed).length,
    baja:  gt.filter(t=>t.priority==='baja'  && !t.completed).length
  };
}

// ─── NOTIFICATIONS ───────────────────────────────────────────────────────────
let notifTimer;
function notify(msg, type='ok'){
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.className = `notif notif-${type}`;
  el.style.display = 'block';
  clearTimeout(notifTimer);
  notifTimer = setTimeout(()=>el.style.display='none', 3200);
}

// ─── VIEW ROUTING ────────────────────────────────────────────────────────────
function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.nav-btn')[name==='dashboard'?0:name==='members'?1:-1]?.classList.add('active');
  if(name==='dashboard') renderDashboard();
  if(name==='members')   renderMembers();
}

function openGroup(groupId, memberId=null){
  currentGroupId  = groupId;
  currentMemberId = memberId;
  filterPriority  = 'todas';
  filterStatus    = 'todas';
  renderGroupView();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-group').classList.add('active');
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
function renderDashboard(){
  const gs = groups.reduce((a,g)=>{const s=getStats(g.id);a.total+=s.total;a.completed+=s.completed;a.pending+=s.pending;a.alta+=s.alta;return a},{total:0,completed:0,pending:0,alta:0});
  let html = `
  <div class="dash-hero">
    <h2>Centro de Control</h2>
    <p>Gestiona los 5 equipos desde un solo lugar</p>
    <div class="global-stats">
      <div class="gstat"><span class="gstat-n">${gs.total}</span><span class="gstat-l">Tareas Totales</span></div>
      <div class="gstat"><span class="gstat-n c-green">${gs.completed}</span><span class="gstat-l">Completadas</span></div>
      <div class="gstat"><span class="gstat-n c-yellow">${gs.pending}</span><span class="gstat-l">Pendientes</span></div>
      <div class="gstat"><span class="gstat-n c-red">${gs.alta}</span><span class="gstat-l">Prioridad Alta</span></div>
    </div>
  </div>
  <div class="groups-grid">`;

  groups.forEach(g=>{
    const s = getStats(g.id);
    const pct = s.total>0 ? Math.round(s.completed/s.total*100) : 0;
    const avatars = g.members.slice(0,4).map(m=>`
      <button class="mavatar" style="--gc:${g.color};border-color:${g.color};color:${g.color};background:${g.color}22"
        title="Ver tareas de ${m.name}" onclick="openGroup('${g.id}','${m.id}')">${initials(m.name)}</button>`).join('');

    html += `
    <div class="group-card" style="--gc:${g.color};border-left-color:${g.color}">
      <div class="gc-head">
        <span class="gc-emoji">${g.emoji}</span>
        <div class="gc-info"><h3>${g.name}</h3><span>${g.members.length} miembros</span></div>
        <span class="gc-badge" style="background:${g.color}22;color:${g.color}">${s.pending} pendientes</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${g.color}"></div></div>
        <span class="progress-lbl">${pct}% completado</span>
      </div>
      <div class="prio-chips">
        <span class="pchip" style="border-color:#FF475755;color:#FF4757">🔴 <strong>${s.alta}</strong> Alta</span>
        <span class="pchip" style="border-color:#FFA50255;color:#FFA502">🟡 <strong>${s.media}</strong> Media</span>
        <span class="pchip" style="border-color:#2ED57355;color:#2ED573">🟢 <strong>${s.baja}</strong> Baja</span>
      </div>
      <div class="members-row">${avatars}${g.members.length>4?`<span style="font-family:var(--font-mono);font-size:.72rem;color:var(--text2);align-self:center">+${g.members.length-4}</span>`:''}</div>
      <button class="btn-all" style="--gc:${g.color}" onclick="openGroup('${g.id}')">📋 Ver todas las tareas</button>
    </div>`;
  });
  html += '</div>';
  document.getElementById('view-dashboard').innerHTML = html;
}

// ─── GROUP VIEW ───────────────────────────────────────────────────────────────
function renderGroupView(){
  const g = getGroup(currentGroupId);
  if(!g) return;
  const cm = currentMemberId ? getMember(currentGroupId, currentMemberId) : null;
  const visibleTasks = getVisibleTasks(currentGroupId, currentMemberId, filterPriority, filterStatus);

  const memberTabs = `
    <button class="mtab ${!currentMemberId?'active':''}" 
      style="${!currentMemberId?`border-color:${g.color};color:${g.color}`:''}"
      onclick="currentMemberId=null;renderGroupView()">👥 Todos</button>
    ${g.members.map(m=>`
      <button class="mtab ${currentMemberId===m.id?'active':''}"
        style="${currentMemberId===m.id?`border-color:${g.color};color:${g.color}`:''}"
        onclick="currentMemberId='${m.id}';renderGroupView()">${m.name.split(' ')[0]}</button>`).join('')}`;

  const taskCards = visibleTasks.length===0
    ? `<div class="empty"><span>📭</span><p>No hay tareas con estos filtros</p><button onclick="openNewTaskModal()" style="color:${g.color};background:none;border:none;margin-top:.5rem;font-size:.9rem;font-family:var(--font-head)">Crear primera tarea →</button></div>`
    : visibleTasks.map(t=>renderTaskCard(t,g)).join('');

  document.getElementById('view-group').innerHTML = `
    <div class="gv-header" style="--gc:${g.color};border-left-color:${g.color}">
      <button class="back-btn" onclick="showView('dashboard')">← Volver</button>
      <div class="gv-title">
        <span class="gv-emoji">${g.emoji}</span>
        <div>
          <h2>${g.name}</h2>
          ${cm?`<p class="gv-sub">Tareas de <strong>${cm.name}</strong> <button onclick="currentMemberId=null;renderGroupView()" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:.75rem">✕ Ver todas</button></p>`:''}
        </div>
      </div>
      <button class="btn-new" style="background:${g.color}" onclick="openNewTaskModal()">+ Nueva Tarea</button>
    </div>
    <div class="member-tabs">${memberTabs}</div>
    <div class="filters">
      <div class="fg">
        <span class="flabel">Prioridad:</span>
        ${['todas','alta','media','baja'].map(p=>`
          <button class="fbtn ${p==='alta'?'fa':p==='media'?'fm':p==='baja'?'fb':''} ${filterPriority===p?'active':''}"
            onclick="filterPriority='${p}';renderGroupView()">${p==='alta'?'🔴 ':p==='media'?'🟡 ':p==='baja'?'🟢 ':''}${p.charAt(0).toUpperCase()+p.slice(1)}</button>`).join('')}
      </div>
      <div class="fg">
        <span class="flabel">Estado:</span>
        ${['todas','pendientes','completadas'].map(s=>`
          <button class="fbtn ${filterStatus===s?'active':''}" onclick="filterStatus='${s}';renderGroupView()">${s.charAt(0).toUpperCase()+s.slice(1)}</button>`).join('')}
      </div>
    </div>
    <div class="tasks-list">${taskCards}</div>`;
}

function renderTaskCard(t, g){
  const cfg = PCFG[t.priority];
  const assignedMember = t.assignedTo !== 'todos' ? getMember(t.groupId, t.assignedTo) : null;
  const isExp = expandedTasks.has(t.id);
  return `
  <div class="tcard ${t.completed?'done':''}" style="--pc:${cfg.color};--gc:${g.color}">
    <div class="tpbar"></div>
    <div class="tmain">
      <button class="tchk ${t.completed?'checked':''}" style="${t.completed?`background:${g.color};border-color:${g.color}`:''}"
        onclick="toggleTask('${t.id}')">${t.completed?'✓':''}</button>
      <div class="tcontent">
        <div class="ttrow">
          <span class="ttitle">${t.title}</span>
          <div class="tbadges">
            <span class="pbadge" style="color:${cfg.color};background:${cfg.bg}">${cfg.icon} ${cfg.label}</span>
            ${assignedMember
              ? `<span class="abadge" style="border-color:${g.color}60;color:${g.color}">👤 ${assignedMember.name.split(' ')[0]}</span>`
              : `<span class="abadge abadge-all">👥 Todos</span>`}
          </div>
        </div>
        ${t.description?`<p class="tdesc ${isExp?'exp':''}" onclick="toggleExpand('${t.id}')">${t.description}</p>`:''}
        ${isExp?`<div class="tmeta"><span>📅 Creado: ${fmtDate(t.createdAt)}</span>${t.completed?`<span>✅ Completado: ${fmtDate(t.completedAt)}</span>`:''}</div>`:''}
      </div>
      <div class="tactions">
        <button class="tbtn" title="Editar" onclick="openEditModal('${t.id}')">✏️</button>
        <button class="tbtn tbtn-del" title="Eliminar" onclick="deleteTask('${t.id}')">🗑️</button>
      </div>
    </div>
  </div>`;
}

function toggleExpand(id){
  expandedTasks.has(id) ? expandedTasks.delete(id) : expandedTasks.add(id);
  renderGroupView();
}

// ─── TASK ACTIONS ────────────────────────────────────────────────────────────
function toggleTask(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.completed = !t.completed;
  t.completedBy = t.completed ? (currentMemberId || 'admin') : null;
  t.completedAt = t.completed ? new Date().toISOString() : null;
  save(); renderGroupView();
  notify(t.completed ? '✅ Tarea completada' : '🔄 Tarea reabierta');
}

function deleteTask(id){
  tasks = tasks.filter(t=>t.id!==id);
  save(); renderGroupView();
  notify('🗑️ Tarea eliminada');
}

// ─── NEW TASK MODAL ───────────────────────────────────────────────────────────
function openNewTaskModal(){
  const g = getGroup(currentGroupId);
  if(!g) return;
  const membersOpts = g.members.map(m=>`<option value="${m.id}">👤 ${m.name} (${m.role})</option>`).join('');
  showModal(`
    <div class="modal" style="--gc:${g.color}" onclick="event.stopPropagation()">
      <div class="mhead">
        <h3>${g.emoji} Nueva Tarea — ${g.name}</h3>
        <button class="mclose" onclick="closeModal()">✕</button>
      </div>
      <div class="mbody">
        <div class="field">
          <label>Título *</label>
          <input id="nt-title" class="finput" placeholder="¿Qué hay que hacer?" autofocus/>
          <span id="nt-err" class="ferr"></span>
        </div>
        <div class="field">
          <label>Descripción</label>
          <textarea id="nt-desc" class="finput ftarea" placeholder="Detalles opcionales..."></textarea>
        </div>
        <div class="field">
          <label>Prioridad</label>
          <div class="psel">
            ${['alta','media','baja'].map(p=>`
              <button id="ps-${p}" class="psbtn" 
                style="border-color:${PCFG[p].color}60;color:${PCFG[p].color}"
                onclick="selectPriority('${p}')">${PCFG[p].icon} ${p.charAt(0).toUpperCase()+p.slice(1)}</button>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>Asignar a</label>
          <select id="nt-assign" class="finput fselect" onchange="updateAssignNote()">
            <option value="todos">👥 Todos los miembros del grupo</option>
            ${membersOpts}
          </select>
          <p id="nt-note" class="anote" style="color:${g.color};display:none">⚠️ Solo el miembro seleccionado verá esta tarea</p>
        </div>
      </div>
      <div class="mfoot">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-create" style="background:${g.color}" onclick="submitNewTask()">✅ Crear Tarea</button>
      </div>
    </div>`);
  selectPriority('media');
}

let _selectedPriority = 'media';
function selectPriority(p){
  _selectedPriority = p;
  ['alta','media','baja'].forEach(x=>{
    const b = document.getElementById('ps-'+x);
    if(!b) return;
    if(x===p){ b.style.background=PCFG[x].color; b.style.color='#000'; b.style.borderColor=PCFG[x].color; }
    else { b.style.background='none'; b.style.color=PCFG[x].color; b.style.borderColor=PCFG[x].color+'60'; }
  });
}

function updateAssignNote(){
  const v = document.getElementById('nt-assign')?.value;
  const n = document.getElementById('nt-note');
  if(n) n.style.display = v !== 'todos' ? 'block' : 'none';
}

function submitNewTask(){
  const title = document.getElementById('nt-title')?.value.trim();
  if(!title){ document.getElementById('nt-err').textContent='El título es obligatorio'; return; }
  tasks.unshift({
    id: 'task_'+Date.now(),
    title,
    description: document.getElementById('nt-desc')?.value.trim() || '',
    priority: _selectedPriority,
    groupId: currentGroupId,
    assignedTo: document.getElementById('nt-assign')?.value || 'todos',
    createdAt: new Date().toISOString(),
    completed: false, completedBy: null, completedAt: null,
    createdBy: currentMemberId || 'admin'
  });
  save(); closeModal(); renderGroupView();
  notify('✅ Tarea creada exitosamente');
}

// ─── EDIT TASK MODAL ──────────────────────────────────────────────────────────
function openEditModal(taskId){
  const t = tasks.find(x=>x.id===taskId);
  const g = getGroup(t.groupId);
  if(!t||!g) return;
  const membersOpts = g.members.map(m=>`<option value="${m.id}" ${t.assignedTo===m.id?'selected':''}>👤 ${m.name} (${m.role})</option>`).join('');
  showModal(`
    <div class="modal" style="--gc:${g.color}" onclick="event.stopPropagation()">
      <div class="mhead">
        <h3>✏️ Editar Tarea</h3>
        <button class="mclose" onclick="closeModal()">✕</button>
      </div>
      <div class="mbody">
        <div class="field">
          <label>Título *</label>
          <input id="et-title" class="finput" value="${t.title.replace(/"/g,'&quot;')}"/>
          <span id="et-err" class="ferr"></span>
        </div>
        <div class="field">
          <label>Descripción</label>
          <textarea id="et-desc" class="finput ftarea">${t.description||''}</textarea>
        </div>
        <div class="field">
          <label>Prioridad</label>
          <div class="psel">
            ${['alta','media','baja'].map(p=>`
              <button id="ep-${p}" class="psbtn"
                style="border-color:${PCFG[p].color}60;color:${PCFG[p].color}"
                onclick="selectEditPriority('${p}')">${PCFG[p].icon} ${p.charAt(0).toUpperCase()+p.slice(1)}</button>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>Asignar a</label>
          <select id="et-assign" class="finput fselect">
            <option value="todos" ${t.assignedTo==='todos'?'selected':''}>👥 Todos</option>
            ${membersOpts}
          </select>
        </div>
      </div>
      <div class="mfoot">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-create" style="background:${g.color}" onclick="submitEditTask('${taskId}')">💾 Guardar</button>
      </div>
    </div>`);
  selectEditPriority(t.priority);
}

let _editPriority = 'media';
function selectEditPriority(p){
  _editPriority = p;
  ['alta','media','baja'].forEach(x=>{
    const b = document.getElementById('ep-'+x);
    if(!b) return;
    if(x===p){ b.style.background=PCFG[x].color; b.style.color='#000'; b.style.borderColor=PCFG[x].color; }
    else { b.style.background='none'; b.style.color=PCFG[x].color; b.style.borderColor=PCFG[x].color+'60'; }
  });
}

function submitEditTask(id){
  const title = document.getElementById('et-title')?.value.trim();
  if(!title){ document.getElementById('et-err').textContent='El título es obligatorio'; return; }
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.title       = title;
  t.description = document.getElementById('et-desc')?.value.trim() || '';
  t.priority    = _editPriority;
  t.assignedTo  = document.getElementById('et-assign')?.value || 'todos';
  save(); closeModal(); renderGroupView();
  notify('💾 Tarea actualizada');
}

// ─── MODAL HELPERS ────────────────────────────────────────────────────────────
function showModal(content){
  const overlay = document.getElementById('modal-overlay');
  overlay.innerHTML = content;
  overlay.style.display = 'flex';
}
function closeModal(e){
  if(e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').style.display = 'none';
}

// ─── MEMBERS PANEL ────────────────────────────────────────────────────────────
function renderMembers(){
  let html = `
  <div class="mp-head"><h2>👥 Gestión de Miembros</h2><p>Administra los integrantes de cada grupo</p></div>
  <div class="gtabs">
    ${groups.map(g=>`
      <button class="gtab ${selectedMGroupId===g.id?'active':''}"
        style="${selectedMGroupId===g.id?`background:${g.color}22;border-color:${g.color};color:${g.color}`:''}"
        onclick="selectedMGroupId='${g.id}';renderMembers()">
        ${g.emoji} ${g.name}
        <span class="gtab-c" style="${selectedMGroupId===g.id?`background:${g.color}`:''}">${g.members.length}</span>
      </button>`).join('')}
  </div>`;

  const g = getGroup(selectedMGroupId);
  if(g){
    const memberRows = g.members.length===0
      ? '<div class="empty-m"><span>🤷</span><p>No hay miembros aún</p></div>'
      : g.members.map(m=>`
        <div class="mrow">
          <div class="mav-lg" style="background:${g.color}22;color:${g.color}">${initials(m.name)}</div>
          <div class="mdetails">
            <span class="mname">${m.name}</span>
            <span class="mrole">${m.role}</span>
            ${m.email?`<span class="memail">✉️ ${m.email}</span>`:''}
          </div>
          <div class="macts">
            <button class="btn-vm" style="color:${g.color};border-color:${g.color}50" onclick="openGroup('${g.id}','${m.id}')">Ver tareas</button>
            <button class="btn-rm" onclick="confirmRemoveMember('${g.id}','${m.id}','${m.name.replace(/'/g,"\\'")}')">🗑️</button>
          </div>
        </div>`).join('');

    const rolesOpts = ROLES.map(r=>`<option value="${r}">${r}</option>`).join('');
    html += `
    <div class="mcontent">
      <div class="mtoolbar">
        <h3 style="color:${g.color}">${g.emoji} ${g.name}</h3>
        <div class="tbar-acts">
          <button class="btn-vt" onclick="openGroup('${g.id}')">📋 Ver tareas</button>
          <button class="btn-am" style="background:${g.color}" onclick="toggleAddMemberForm('${g.id}')">+ Agregar miembro</button>
        </div>
      </div>
      <div id="add-member-form" style="display:none" class="amform" style="--gc:${g.color}">
        <h4>Nuevo Miembro</h4>
        <div class="frow">
          <div class="field"><label>Nombre *</label><input id="nm-name" class="fi" placeholder="Ej: María López"/></div>
          <div class="field"><label>Rol</label><select id="nm-role" class="fi">${rolesOpts}</select></div>
          <div class="field"><label>Email</label><input id="nm-email" class="fi" type="email" placeholder="email@equipo.com"/></div>
        </div>
        <button class="btn-ca" style="background:${g.color}" onclick="submitAddMember('${g.id}')">✅ Confirmar</button>
      </div>
      <div class="mlist">${memberRows}</div>
    </div>`;
  }
  document.getElementById('view-members').innerHTML = html;
}

function toggleAddMemberForm(){
  const f = document.getElementById('add-member-form');
  if(f) f.style.display = f.style.display==='none' ? 'block' : 'none';
}

function submitAddMember(groupId){
  const name  = document.getElementById('nm-name')?.value.trim();
  const role  = document.getElementById('nm-role')?.value || 'Desarrollador';
  const email = document.getElementById('nm-email')?.value.trim();
  if(!name){ notify('El nombre es obligatorio','err'); return; }
  const g = getGroup(groupId);
  g.members.push({ id:`${groupId}_${Date.now()}`, name, role, email });
  save(); renderMembers();
  notify(`👤 ${name} agregado a ${g.name}`);
}

function confirmRemoveMember(groupId, memberId, memberName){
  const g = getGroup(groupId);
  showModal(`
    <div class="modal" style="--gc:${g.color};max-width:360px" onclick="event.stopPropagation()">
      <div class="mhead"><h3>¿Eliminar miembro?</h3><button class="mclose" onclick="closeModal()">✕</button></div>
      <div class="mbody"><p style="color:var(--text2);font-size:.9rem">Se eliminará a <strong style="color:var(--text)">${memberName}</strong> de ${g.name}.<br>Las tareas asignadas a esta persona no se borrarán.</p></div>
      <div class="mfoot">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-create" style="background:#ff4757" onclick="removeMember('${groupId}','${memberId}','${memberName.replace(/'/g,"\\'")}')">Eliminar</button>
      </div>
    </div>`);
}

function removeMember(groupId, memberId, memberName){
  const g = getGroup(groupId);
  g.members = g.members.filter(m=>m.id!==memberId);
  save(); closeModal(); renderMembers();
  notify(`❌ ${memberName} eliminado`);
}

// ─── EXPORT ───────────────────────────────────────────────────────────────────
function exportJSON(){
  const data = { groups, tasks, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `taskbot_${Date.now()}.json`; a.click();
  URL.revokeObjectURL(url);
  notify('💾 JSON exportado correctamente');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderDashboard();
</script>
</body>
</html>
